<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>限时链接 · 内容后台</title>
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body data-page="links">
  <header class="topbar">
    <span class="brand">内容后台</span>
    <span class="user" data-user></span>
    <button class="btn ghost" data-logout>退出</button>
  </header>
  <nav class="tabs">
    <a href="/admin/videos.html">视频</a>
    <a href="/admin/images.html">图片</a>
    <a class="active" href="/admin/links.html">限时链接</a>
  </nav>
  <main>
    <div class="row" style="justify-content: space-between; margin-bottom: 16px;">
      <h2 style="font-size: 18px;">限时审片链接</h2>
      <button class="btn primary" id="addBtn">＋ 新建链接</button>
    </div>
    <div id="list"></div>
  </main>

  <template id="createTpl">
    <div class="sheet-mask">
      <div class="sheet">
        <h2>新建限时链接</h2>
        <div class="field">
          <label>标题（客户看到的名字）</label>
          <input name="title" placeholder="例如：XX 项目初审版">
        </div>
        <div class="field">
          <label>备注（可选）</label>
          <textarea name="note" placeholder="给客户的说明，如：这是第一版粗剪，反馈截止周五"></textarea>
        </div>
        <div class="field">
          <label>有效期</label>
          <select name="hours">
            <option value="1" selected>1 小时</option>
            <option value="6">6 小时</option>
            <option value="24">24 小时</option>
            <option value="72">3 天</option>
          </select>
        </div>
        <div class="field">
          <label>勾选视频</label>
          <div class="pick-grid" data-pick-videos>
            <div class="empty" style="grid-column: 1 / -1; padding: 16px 0;">暂无可选视频，请先在「视频」页添加</div>
          </div>
        </div>
        <div class="field">
          <label>勾选图片</label>
          <div class="pick-grid" data-pick-images>
            <div class="empty" style="grid-column: 1 / -1; padding: 16px 0;">暂无可选图片，请先在「图片」页添加</div>
          </div>
        </div>
        <div class="sheet-actions">
          <button class="btn" data-cancel>取消</button>
          <button class="btn primary" data-save>生成链接</button>
        </div>
      </div>
    </div>
  </template>

  <script type="module">
    import init from '/admin/assets/pages/links.js';
    init();
  </script>
</body>
</html>
