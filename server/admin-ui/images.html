<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>图片管理 · 内容后台</title>
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body data-page="images">
  <header class="topbar">
    <span class="brand">内容后台</span>
    <span class="user" data-user></span>
    <button class="btn ghost" data-logout>退出</button>
  </header>
  <nav class="tabs">
    <a href="/admin/videos.html">视频</a>
    <a class="active" href="/admin/images.html">图片</a>
    <a href="/admin/links.html">限时链接</a>
  </nav>
  <main>
    <div class="row" style="justify-content: space-between; margin-bottom: 16px;">
      <h2 style="font-size: 18px;">首页图片</h2>
      <button class="btn primary" id="addBtn">＋ 新增图片</button>
    </div>
    <div id="list"></div>
  </main>

  <template id="editTpl">
    <div class="sheet-mask">
      <div class="sheet">
        <h2 data-title>新增图片</h2>
        <div class="field">
          <label>使用位置</label>
          <select name="section">
            <option value="hero">首页 Hero 主图</option>
            <option value="showcase_poster">视频区封面</option>
          </select>
        </div>
        <div class="field">
          <label>上传图片（可选）</label>
          <input type="file" name="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif">
          <div class="hint">jpg / png / webp / gif / avif，最大 10MB</div>
        </div>
        <div class="field">
          <label>或图片 URL</label>
          <input name="src" placeholder="https://... 或上传后自动填充" inputmode="url">
        </div>
        <div class="field">
          <label>描述（alt，可选）</label>
          <input name="alt" placeholder="图片说明">
        </div>
        <div class="field">
          <label>排序（小的在前）</label>
          <input name="sort" type="number" value="0">
        </div>
        <div class="sheet-actions">
          <button class="btn" data-cancel>取消</button>
          <button class="btn primary" data-save>保存</button>
        </div>
      </div>
    </div>
  </template>

  <script type="module">
    import init from '/admin/assets/pages/images.js';
    init();
  </script>
</body>
</html>
