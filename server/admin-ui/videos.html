<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>视频管理 · 内容后台</title>
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body data-page="videos">
  <header class="topbar">
    <span class="brand">内容后台</span>
    <span class="user" data-user></span>
    <button class="btn ghost" data-logout>退出</button>
  </header>
  <nav class="tabs">
    <a class="active" href="/admin/videos.html">视频</a>
    <a href="/admin/images.html">图片</a>
    <a href="/admin/links.html">限时链接</a>
  </nav>
  <main>
    <div class="row" style="justify-content: space-between; margin-bottom: 16px;">
      <h2 style="font-size: 18px;">B 站视频</h2>
      <button class="btn primary" id="addBtn">＋ 新增视频</button>
    </div>
    <div id="list"></div>
  </main>

  <template id="editTpl">
    <div class="sheet-mask">
      <div class="sheet">
        <h2 data-title>新增视频</h2>
        <div class="field">
          <label>视频标题</label>
          <input name="title" placeholder="展示在官网上的标题">
        </div>
        <div class="field">
          <label>B 站链接</label>
          <input name="bilibiliUrl" placeholder="https://www.bilibili.com/video/BV..." inputmode="url">
          <div class="hint">支持普通视频页链接或直接粘贴 BV 号</div>
        </div>
        <div class="field">
          <label>封面图 URL（可选）</label>
          <input name="cover" placeholder="https://... 或上传后获得的 /uploads/... 地址">
        </div>
        <div class="field">
          <label>排序（小的在前）</label>
          <input name="sort" type="number" value="0">
        </div>
        <div class="sheet-actions">
          <button class="btn" data-cancel>取消</button>
          <button class="btn primary" data-save>保存</button>
        </div>
      </div>
    </div>
  </template>

  <script type="module">
    import init from '/admin/assets/pages/videos.js';
    init();
  </script>
</body>
</html>
