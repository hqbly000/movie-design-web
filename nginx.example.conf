# 电影设计官网 + 内容后台 nginx 配置样例
#
# 架构：
#   nginx 80/443
#   ├─ /                    → Astro 静态官网（dist/）
#   └─ /api /p /uploads     → Node 后台服务（127.0.0.1:3001）
#
# 使用方式：
#   1. 官网构建：cd frontend && npm run build，产物 frontend/dist 上传到 /var/www/movie-design/dist
#   2. 后台服务在服务器上以 3001 端口运行（server/ 目录，npm start）
#   3. 修改下方 server_name 与证书路径后，放到 /etc/nginx/conf.d/ 下并 reload

server {
    listen 80;
    server_name example.com;   # TODO: 换成你的域名

    # 官网静态资源
    root /var/www/movie-design/dist;
    index index.html;

    # 静态资源缓存（Astro 产物带 hash，可长缓存）
    location /_astro/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ① 后台 API
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ② 限时审片链接页（/p/:token）
    location /p/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ③ 上传的图片
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ④ 管理后台入口（保持独立入口，也可按需改成别的路径或加 IP 白名单）
    location /admin {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 兜底（Astro 静态页 404 时回 index.html，可按需调整）
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # 上传体积限制（与后端 multer 10MB 一致）
    client_max_body_size 12m;
}

